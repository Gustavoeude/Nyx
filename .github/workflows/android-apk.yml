name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "fix/**", "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "script.js"
      - "js/**"
      - "style.css"
      - "jsmediatags.min.js"
      - "manifest.json"
      - "icon-*.png"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "native/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sincronizar versão com a tag da release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválida: $RELEASE_TAG. Use o formato vMAJOR.MINOR.PATCH, por exemplo v1.2.2."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e 'const expected=process.argv[1], p=require("./package.json"), l=require("./package-lock.json"); if (p.version !== expected || l.version !== p.version || l.packages?.[""]?.version !== p.version) process.exit(1); console.log(`Versão sincronizada: ${p.version}`)' "$VERSION"

      - name: Verificar sintaxe JavaScript
        run: |
          for f in js/*.js; do node --check "$f"; done
          node --check scripts/copy-web.js
          node --check scripts/patch-android.js

      - name: Instalar dependências
        run: npm ci

      - name: Preparar arquivos web
        run: npm run build:web

      - name: Gerar projeto Android com Capacitor
        run: npx cap add android

      - name: Instalar o serviço de áudio em segundo plano
        run: npm run patch:android

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Compilar APK sem credenciais de assinatura
        run: |
          mkdir -p out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            (cd android && ./gradlew assembleRelease)
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/Musica-unsigned.apk
          else
            (cd android && ./gradlew assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk out/Musica-debug.apk
          fi

      - name: Disponibilizar APK de build
        uses: actions/upload-artifact@v4
        with:
          name: nyx-apk
          path: out/*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar APK unsigned
        uses: actions/download-artifact@v4
        with:
          name: nyx-apk
          path: out

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Assinar e verificar APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KS_PASS" ] || [ -z "$KS_B64" ]; then
            echo "Faltam KEYSTORE_PASSWORD/KEYSTORE_BASE64; não é possível publicar uma release assinada."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nyx.jks"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 out/Musica-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/nyx.jks" --ks-key-alias musica \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out out/Nyx.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs out/Nyx.apk | head -3
          rm -f "$RUNNER_TEMP/nyx.jks"

      - name: Disponibilizar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: Nyx-release-apk
          path: out/Nyx.apk
          if-no-files-found: error

      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" out/Nyx.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nyx $VERSAO" \
            --generate-notes
