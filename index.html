<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Nyx</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontes carregam em segundo plano: a página aparece na hora, mesmo com internet lenta -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css?v=50">
  <script>
    /* Primeira instalação: esconde o app até o tutorial abrir (evita ver a tela inicial antes). */
    try {
      if (!localStorage.getItem("onboardingDone") && !localStorage.getItem("permsAsked")) {
        document.documentElement.classList.add("ob-pending");
        setTimeout(function () {
          if (!document.querySelector(".ob")) document.documentElement.classList.remove("ob-pending");
        }, 8000);
      }
    } catch (e) {}
  </script>
</head>

<body data-page="home">
  <audio id="audio" preload="metadata"></audio>
  <input type="file" id="fileInput" accept="audio/*,.lrc" multiple hidden>
  <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
  <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden>
  <input type="file" id="lrcInput" accept=".lrc,.txt,text/plain" hidden>
  <input type="file" id="coverInput" accept="image/*" hidden>

  <!-- Barra superior (aparece em Search e Library) -->
  <header class="topbar">
    <div class="top-actions">
      <button class="top-button" id="themeBtn" aria-label="Alternar tema"></button>
      <button class="top-button" id="addBtn" aria-label="Adicionar músicas">
        <span class="material-symbols-rounded">add</span>
      </button>
    </div>
  </header>

  <main>
    <!-- ============ YOUR MIX ============ -->
    <section class="page active" id="homePage">
      <div class="home-top">
        <div class="home-title">
          <h1 class="home-brand">Nyx</h1>
          <p class="eyebrow home-eyebrow" id="greeting">SUA MÚSICA, SEU UNIVERSO</p>
        </div>
        <div class="home-actions">
          <button class="icon-btn home-settings" id="homeTheme" aria-label="Alternar tema"></button>
          <button class="icon-btn home-settings" id="homeSettings" aria-label="Ajustes">
            <span class="material-symbols-rounded">settings</span>
          </button>
        </div>
      </div>

      <div class="home-chips" id="homeChips" role="tablist">
        <button class="hchip active" data-tab="foryou" role="tab">Para você</button>
        <button class="hchip" data-tab="recent" role="tab">Recentes</button>
        <button class="hchip" data-tab="fav" role="tab">Favoritas</button>
      </div>

      <div class="cont-card" id="contCard">
        <p class="cont-label">Continuar ouvindo</p>
        <div class="cont-row">
          <button class="art-main" id="artMain" aria-label="Tocar música"></button>
          <div class="cont-info">
            <strong id="contTitle">Sua coleção musical</strong>
            <span id="contArtist"></span>
          </div>
        </div>
        <div class="cont-bottom">
          <div class="wv" id="contWave" role="progressbar" aria-label="Progresso da música">
            <div class="wv-fill"></div>
          </div>
          <button class="hero-play" id="heroPlay" aria-label="Tocar ou pausar"></button>
          <button class="cont-next" id="contNext" aria-label="Próxima música">
            <span class="material-symbols-rounded">skip_next</span>
          </button>
          <span class="cont-time" id="contTime">0:00 / 0:00</span>
        </div>
      </div>

      <div class="fav-card" id="favCard">
        <button class="fav-head" id="favHead" type="button">
          <strong>Seus favoritos</strong>
        </button>
        <div class="fav-grid">
          <button class="fav-cov" id="artSmall1" aria-label="Tocar música"></button>
          <button class="fav-cov" id="artSmall2" aria-label="Tocar música"></button>
          <button class="fav-cov" id="artSmall3" aria-label="Tocar música"></button>
          <button class="fav-cov" id="artSmall4" aria-label="Tocar música"></button>
        </div>
      </div>

      <div class="home-stats" id="homeStats" hidden></div>

      <section class="home-section" id="favSection" hidden>
        <h2 class="page-section-title">Favoritas</h2>
        <div class="hscroll" id="favList"></div>
      </section>

      <section class="home-section" id="topSection" hidden>
        <h2 class="page-section-title">Mais ouvidas</h2>
        <div class="hscroll" id="topList"></div>
      </section>

      <section class="home-section" id="recentSection" hidden>
        <h2 class="page-section-title">Tocadas recentemente</h2>
        <div class="hscroll" id="recentList"></div>
      </section>
    </section>

    <!-- ============ SEARCH ============ -->
    <section class="page" id="searchPage">
      <div class="page-heading">
        <p class="eyebrow">DESCUBRA SUAS MÚSICAS</p>
        <h1>Search<span class="accent">.</span></h1>
        <p>Pesquise na sua coleção.</p>
      </div>

      <label class="search-box">
        <span class="material-symbols-rounded">search</span>
        <input id="searchInput" type="search" aria-label="Pesquisar músicas na coleção" placeholder="Pesquisar músicas..." autocomplete="off">
      </label>

      <h2 class="page-section-title">Suas músicas</h2>
      <div class="song-list" id="searchSongList"></div>
      <p class="sr-only" id="searchStatus" role="status" aria-live="polite" aria-atomic="true"></p>

    </section>

    <!-- ============ LIBRARY ============ -->
    <section class="page" id="libraryPage">
      <div class="lib-head">
        <div class="lib-title">
          <h1>Biblioteca</h1>
          <p id="libraryCount">0 músicas adicionadas</p>
        </div>
        <button class="icon-btn home-settings" id="libraryHeadAdd" aria-label="Adicionar músicas">
          <span class="material-symbols-rounded">add</span>
        </button>
      </div>

      <div class="lib-tabs" id="libTabs" role="tablist">
        <button class="lib-tab active" data-tab="songs" role="tab">Músicas</button>
        <button class="lib-tab" data-tab="albums" role="tab">Álbuns</button>
        <button class="lib-tab" data-tab="artists" role="tab">Artistas</button>
      </div>

      <div class="filters" id="filters"></div>
      <div class="playlist-bar" id="playlistBar" hidden></div>

      <div class="song-list" id="songList"></div>

      <button class="library-add-button" id="libraryAdd">
        <span class="material-symbols-rounded">add</span>
        Adicionar músicas
      </button>
    </section>
  </main>

  <!-- Mini player global -->
  <div class="now-playing" id="nowPlaying" hidden>
    <div class="now-cover" id="nowCover"></div>
    <button class="now-info" id="nowInfo" type="button" aria-label="Abrir player completo">
      <strong id="nowTitle">Nenhuma música</strong>
      <span id="nowArtist">Adicione músicas na Biblioteca</span>
    </button>
    <button class="now-lyrics" id="nowLyrics" aria-label="Abrir letras da música atual">
      <span class="material-symbols-rounded" aria-hidden="true">lyrics</span>
      <span>Letra</span>
    </button>
    <button class="now-play" id="nowPlay" aria-label="Tocar ou pausar"></button>
    <div class="now-progress"><i id="miniProgress"></i></div>
  </div>

  <!-- Navegação (Material 3 Navigation Bar) -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-target="home" aria-current="page">
      <span class="nav-icon"><span class="material-symbols-rounded">home</span></span>
      <small>Início</small>
    </button>
    <button class="nav-item" data-target="search">
      <span class="nav-icon"><span class="material-symbols-rounded">search</span></span>
      <small>Buscar</small>
    </button>
    <button class="nav-item" data-target="library">
      <span class="nav-icon"><span class="material-symbols-rounded">notes</span></span>
      <small>Biblioteca</small>
    </button>
    <button class="nav-fab" id="navShuffle" aria-label="Aleatório desligado" aria-pressed="false">
      <span class="material-symbols-rounded">shuffle</span>
    </button>
  </nav>

  <!-- ============ PLAYER COMPLETO ============ -->
  <div class="full-player" id="fullPlayer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="fpDialogTitle" tabindex="-1">
    <div class="fp-top">
      <button class="icon-btn" id="fpClose" aria-label="Fechar">
        <span class="material-symbols-rounded">keyboard_arrow_down</span>
      </button>
      <span class="fp-top-title" id="fpDialogTitle">Tocando agora</span>
      <div class="fp-top-actions">
        <button class="icon-btn lyrics-toggle" id="fpLyricsBtn" aria-label="Mostrar letra" aria-pressed="false">
          <span class="material-symbols-rounded">lyrics</span>
          <span class="lyrics-toggle-label">Letra</span>
        </button>
        <button class="icon-btn" id="fpMenu" aria-label="Mais opções">
          <span class="material-symbols-rounded">more_vert</span>
        </button>
      </div>
    </div>

    <div class="fp-stage" id="fpStage">
      <div class="fp-cover" id="fpCover"></div>
      <div class="fp-lyrics" id="fpLyrics"></div>
    </div>

    <div class="fp-meta">
      <div class="fp-meta-text">
        <h2 id="fpTitle">—</h2>
        <p id="fpArtist">—</p>
      </div>
      <button class="icon-btn fp-fav" id="fpFav" aria-label="Adicionar aos favoritos" aria-pressed="false"></button>
    </div>

    <div class="fp-progress">
      <div class="seek-wrap" id="seekWrap">
        <canvas class="wave" id="waveCanvas" aria-hidden="true"></canvas>
        <input type="range" class="seek" id="seek" min="0" max="1000" value="0" step="1" aria-label="Progresso">
      </div>
      <div class="fp-times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>

    <div class="fp-controls">
      <button class="icon-btn" id="fpShuffle" aria-label="Aleatório desligado" aria-pressed="false">
        <span class="material-symbols-rounded">shuffle</span>
      </button>
      <button class="icon-btn big" id="fpPrev" aria-label="Anterior">
        <span class="material-symbols-rounded">skip_previous</span>
      </button>
      <button class="fp-play" id="fpPlay" aria-label="Tocar ou pausar"></button>
      <button class="icon-btn big" id="fpNext" aria-label="Próxima">
        <span class="material-symbols-rounded">skip_next</span>
      </button>
      <button class="icon-btn" id="fpRepeat" aria-label="Repetir desligado" aria-pressed="false">
        <span class="material-symbols-rounded">repeat</span>
      </button>
    </div>
  </div>

  <script src="jsmediatags.min.js?v=32"></script>
  <script src="js/00-erros.js?v=41"></script>
  <script src="js/01-base.js?v=47"></script>
  <script src="js/02-player-nativo.js?v=41"></script>
  <script src="js/03-estado-cor-tema.js?v=44"></script>
  <script src="js/04-navegacao-dialogos.js?v=41"></script>
  <script src="js/05-importar.js?v=42"></script>
  <script src="js/06-playlists-listas.js?v=44"></script>
  <script src="js/07-reproducao.js?v=42"></script>
  <script src="js/08-progresso-player-completo.js?v=43"></script>
  <script src="js/09-ajustes.js?v=49"></script>
  <script src="js/10-fontes-letras.js?v=41"></script>
  <script src="js/pasta-monitorada.js?v=2"></script>
  <script src="js/12-onboarding.js?v=9"></script>
  <script src="js/11-inicio-pwa.js?v=43"></script>
</body>
</html>
